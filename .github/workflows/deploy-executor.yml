# Deploys the warm executor.
#
# okibi owns no storage, keeps no roster and schedules nothing — but the
# executor is a Worker, and a Worker somebody deploys by hand is a Worker that
# eventually runs whatever was last on somebody's laptop. So this repository
# deploys one installation of it: Re:Earth's.
#
# A fork's executor is a fork's business, which is what the repository check
# below says. Without it, a fork of a public repository would run a deploy step
# that fails for want of a secret on every push to its main.

name: Deploy the executor

on:
  push:
    branches: [main]
    paths:
      - "workers/executor/**"
      - ".github/workflows/deploy-executor.yml"
  workflow_dispatch:

# Never two deploys of the same Worker at once, and never cancel one midway:
# a half-rolled Worker is worse than a queued one.
concurrency:
  group: deploy-executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (Cloudflare Workers)
    if: github.repository == 'reearth/okibi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Checked here as well as in CI, because this workflow is what puts the
      # code somewhere it can warm a few thousand real URLs, and a deploy that
      # only ran the tests on a different trigger is a deploy that can ship
      # past a red one.
      - run: pnpm --filter @reearth/okibi-executor typecheck
      - run: pnpm --filter @reearth/okibi-executor test

      - name: Wrangler deploy
        working-directory: workers/executor
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}

      # The secrets are not set here. They are set once with
      # `wrangler secret put` and survive every deploy after it; putting them
      # in a workflow would mean a second copy of two shared secrets living
      # somewhere they can be read back out into a log.
      - name: Say what it is missing
        run: |
          echo "Deployed. OKIBI_EXECUTOR_TOKEN and OKIBI_WARM_SECRET are set" \
               "once by hand — see workers/executor/README.md."
