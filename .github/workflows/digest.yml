name: Digest

# Analytics Engine keeps three months, which is shorter than the history a
# demand model wants, so a digest is taken daily and kept somewhere that does
# not expire. That obligation comes with the binding — see
# spec/bindings/wae-1.md — and this is where it is discharged.
#
# The work is in actions/digest. What is left here is a schedule and a set of
# credentials, which is all an installation is: another one would copy this
# file into its own repository and change nothing but the secrets.
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      date:
        description: The day to aggregate (YYYY-MM-DD). Defaults to yesterday.
        required: false

concurrency:
  group: okibi-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    # Every service in the dataset, because the dataset is the list. A roster
    # kept here would be a second answer to who exists, and wrong the day a
    # service is added to one and not the other.
    name: Aggregate yesterday
    runs-on: ubuntu-latest

    # This schedule is the one place where the tool repository doubles as an
    # installation. Nothing installation-specific is committed — the account
    # and the tokens are variables and secrets — but the schedule itself is,
    # so a fork inherits a cron with nothing behind it. Skipping rather than
    # failing means a fork gets silence instead of a daily red cross.
    if: vars.OKIBI_ACCOUNT_ID != ''

    steps:
      - uses: reearth/okibi/actions/digest@main
        with:
          account-id: ${{ vars.OKIBI_ACCOUNT_ID }}
          api-token: ${{ secrets.OKIBI_CF_API_TOKEN }}
          r2-token: ${{ secrets.OKIBI_R2_TOKEN }}
          date: ${{ inputs.date }}
