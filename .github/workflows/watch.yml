name: Watch

# Not every invalidation is a deploy.
#
# Papers compiles its cache keys in, so a change there arrives as a commit and
# actions/plan catches it. The other two do not: Buildings resolves the latest
# Overture release at request time, and Terrain revalidates against Mapterhorn
# on a six-hour probe. Both can go cold without anyone pushing anything.
#
# So each service publishes what it is currently using, and this compares that
# against what it was using last time. The comparison is the same one a commit
# gets — `okibi invalidation --before --after` does not care whether the two
# files differ because of a deploy or because upstream moved.

on:
  schedule:
    # Every six hours, which is as fine-grained as the thing being watched.
    # Buildings caches its release lookup for a day and Terrain's probe has a
    # six-hour TTL, so polling faster would only ask the same question again.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping runs would plan the same change twice and warm it twice.
  group: okibi-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: Look for what moved
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OKIBI_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
      EXECUTOR_URL: ${{ vars.OKIBI_EXECUTOR_URL }}
      EXECUTOR_TOKEN: ${{ secrets.OKIBI_EXECUTOR_TOKEN }}
      # What a run is allowed to spend without anyone watching. The planner
      # cuts at this rather than skipping, so what was dropped shows up as
      # coverage below one instead of as a run that did not happen.
      BUDGET_USD: ${{ vars.OKIBI_BUDGET_USD || '5' }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build okibi
        run: cargo build --release -p okibi-cli

      - name: Fetch the digests
        run: |
          set -euo pipefail
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get "okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done
          ls digests/ || { echo "okibi: no digests, so nothing can be planned"; exit 1; }

      - name: Compare, plan, warm
        run: |
          set -euo pipefail

          okibi=target/release/okibi
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p state events plans runs

          jq -c '.services[]' watch.json | while read -r entry; do
            service=$(jq -r '.service' <<<"$entry")
            base=$(jq -r '.base_url' <<<"$entry")

            # What the service says it is using right now.
            if ! curl -sf "$base/okibi/epochs.json" -o "state/$service.now.json"; then
              echo "::warning::$service did not answer, skipping this round"
              continue
            fi

            # What it was using when this last ran. A service seen for the
            # first time has no previous state — and no invalidation either,
            # because nothing was cached under epochs nobody has recorded.
            if ! npx --yes wrangler@4 r2 object get "okibi/epochs/$service.json" \
                 --file "state/$service.last.json" --remote 2>/dev/null; then
              echo "okibi: first sight of $service, recording without planning"
              npx --yes wrangler@4 r2 object put "okibi/epochs/$service.json" \
                --file "state/$service.now.json" --remote
              continue
            fi

            "$okibi" invalidation \
              --before "state/$service.last.json" \
              --after "state/$service.now.json" \
              --occurred-at "$now" \
              --out "events/$service/"

            if [ ! -d "events/$service" ]; then
              continue
            fi

            for event in "events/$service"/*.json; do
              tileset=$(basename "$event" .json)
              plan="plans/$service-$tileset.json"

              "$okibi" plan \
                --digests digests/ \
                --invalidation "$event" \
                --manifests "manifests/$service.json" \
                --pricing pricing/cloudflare-2026-08.json \
                --epochs "state/$service.now.json" \
                --budget-usd "$BUDGET_USD" \
                --out "$plan"

              {
                "$okibi" report "$plan" --invalidation "$event"
                printf '\n'
              } >> "$GITHUB_STEP_SUMMARY"

              if [ -n "$EXECUTOR_URL" ]; then
                queued=$(curl -sf -X POST "$EXECUTOR_URL/plans" \
                  -H "Authorization: Bearer $EXECUTOR_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data-binary "@$plan" | jq -r '.queued')
                echo "okibi: handed $queued entries to the executor"
              else
                echo "::warning::no executor configured, so $plan was not run"
              fi

              # The plan is the record the estimate was read off. Actions
              # artifacts expire for their own reasons; the calibration this
              # feeds needs the prediction to still be there when the
              # measurement arrives.
              npx --yes wrangler@4 r2 object put \
                "okibi/plans/$now-$service-$tileset.json" --file "$plan" --remote

              jq -n --arg at "$now" --arg service "$service" --arg tileset "$tileset" \
                    --arg plan "okibi/plans/$now-$service-$tileset.json" \
                    --slurpfile p "$plan" \
                '{ run: "okibi-watch-run/1", at: $at, service: $service,
                   tileset: $tileset, plan: $plan,
                   entries: $p[0].stats.total,
                   coverage: $p[0].stats.coverage_of_demand,
                   usd: $p[0].estimate.warm.usd }' > "runs/$service-$tileset.json"

              npx --yes wrangler@4 r2 object put \
                "okibi/runs/$now-$service-$tileset.json" \
                --file "runs/$service-$tileset.json" --remote
            done

            # Only now. Advancing before the plan is handed over would mean a
            # failure here is never retried: the change would be recorded as
            # seen and nothing would ever warm it.
            npx --yes wrangler@4 r2 object put "okibi/epochs/$service.json" \
              --file "state/$service.now.json" --remote
          done
