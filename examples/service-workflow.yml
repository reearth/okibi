# What a service repository adds to use okibi.
#
# Copy into .github/workflows/ alongside whatever already deploys the service.
# Two things have to be in the repository for this to work: okibi.epochs.json,
# which the service also builds its cache keys from, and okibi.manifest.json,
# which is what okibi is allowed to know about the service.

name: Warm

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every six hours, for the invalidations no commit causes. As fine-grained
    # as the thing being watched: an upstream release lookup cached for a day,
    # a revalidation probe with a six-hour TTL. Polling faster would only ask
    # the same question again.
    - cron: "0 */6 * * *"

jobs:
  # On a pull request nothing is warmed. The estimate is posted, and that on
  # its own is the point: a commit that moves one epoch string has a price,
  # and a reviewer can now see it next to the diff.
  estimate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the previous commit's epochs, to diff against

      - name: Fetch the digests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OKIBI_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        run: |
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get "reearth-papers/okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done

      - uses: reearth/okibi/actions/plan@v0.8.0
        with:
          manifests: okibi.manifest.json
          digests: digests/
          # A handful of the plan's URLs are fetched and checked. The planner
          # fills a template from the manifest and cannot know the template
          # was right; when it is not, every entry answers 404 and the plan
          # still reads as correct — ordered entries, a coverage, a price.
          # The pull request is where that should be caught.
          verify: "5"
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}

  # After a deploy the same plan is derived and then run. Warming is a GET to
  # the service's own on-demand path, so nothing here needs to know how a tile
  # is made.
  warm:
    if: github.event_name == 'push'
    needs: [] # put your deploy job here
    runs-on: ubuntu-latest
    # Warming is not part of shipping. If it fails, the tiles are generated on
    # demand exactly as they would have been.
    continue-on-error: true
    concurrency:
      # A second deploy makes the first deploy's plan obsolete: it warms an
      # epoch that is no longer current.
      group: okibi-warm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Fetch the digests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OKIBI_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        run: |
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get "reearth-papers/okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done

      - uses: reearth/okibi/actions/plan@v0.8.0
        id: plan
        with:
          manifests: okibi.manifest.json
          digests: digests/
          comment: "false"
          # Warming the tiles people ask for in the morning, before morning.
          deadline: ${{ github.event.repository.pushed_at }}

      - uses: reearth/okibi/actions/warm@v0.8.0
        if: steps.plan.outputs.plan != ''
        with:
          plan: ${{ steps.plan.outputs.plan }}
          manifests: okibi.manifest.json
          # Run it here if it fits in a job, hand it to the executor if not.
          mode: auto
          executor-url: ${{ vars.OKIBI_EXECUTOR_URL }}
          executor-token: ${{ secrets.OKIBI_EXECUTOR_TOKEN }}
          # Shared with the service, which believes a request is okibi's only
          # when the header carries this value.
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}

  # Nothing here was pushed. This service resolves part of its cache key at
  # request time, so it can go cold on its own — and it is the one that knows
  # that about itself, which is why the schedule lives here rather than in a
  # central watcher holding a list of who exists.
  watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: okibi-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the digests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OKIBI_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        run: |
          mkdir -p digests
          for day in $(seq 1 7); do
            date=$(date -u -d "-$day day" +%Y-%m-%d)
            npx --yes wrangler@4 r2 object get "reearth-papers/okibi/digests/$date.jsonl" \
              --file "digests/$date.jsonl" --remote || true
          done

      - uses: reearth/okibi/actions/watch@v0.8.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OKIBI_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.OKIBI_ACCOUNT_ID }}
        with:
          service: papers
          state-bucket: reearth-papers
          epochs-url: https://papers.reearth.land/okibi/epochs.json
          manifests: okibi.manifest.json
          digests: digests/
          budget-usd: "5"
          executor-url: ${{ vars.OKIBI_EXECUTOR_URL }}
          executor-token: ${{ secrets.OKIBI_EXECUTOR_TOKEN }}
          warm-secret: ${{ secrets.OKIBI_WARM_SECRET }}
