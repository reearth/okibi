[package]
name = "okibi-wasm"
description = "wasm bindings for okibi, so a Worker can use the same projection the planner does"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
okibi-core.workspace = true
okibi-qk.workspace = true
serde.workspace = true
# Structured values across the boundary. The alternative is JSON strings on
# both sides, which means parsing a digest twice to hand it to a bucket.
serde-wasm-bindgen = "0.6"
wasm-bindgen.workspace = true
